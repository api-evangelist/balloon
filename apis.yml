aid: balloon
name: Balloon
description: >-
  Balloon is a research-backed team collaboration and decision-making platform
  built to eliminate groupthink and give quieter voices a psychologically safe
  way to contribute. Its core workflow, called a "flight," is a two-stage,
  partly anonymous process in which a leader poses a question, team members
  submit ideas ("balloons") and discuss them, and the group then evaluates and
  "pumps" the strongest ideas on merit, surfacing a Balloon Score that shows
  consensus and buy-in. Balloon ships 150+ expert-authored flight templates
  across 25 business areas and supports asynchronous, time-zone-independent
  participation, positioning itself as a replacement for status and ideation
  meetings (the company cites a 70% reduction in meeting time and that ~80% of
  information shared is new to the organization). Founded by Amanda Greenberg
  and Noah Bornstein, Balloon is backed by 500 Global and other investors, with
  an advisory board including Adam Grant, Amy Edmondson, and Daniel Pink. It is
  a SaaS web application (app at balloon.app) with no public developer API,
  OpenAPI, or developer portal at this time.
