source: live probes of /.well-known/* on Balloon hosts
notes: >-
  Balloon (getballoon.com) publishes no first-party /.well-known/ discovery
  surface. The application host balloon.app returns HTTP 200 for every path
  but serves an HTML meta-refresh to /login (SPA catch-all), so none of its
  /.well-known/* responses are genuine documents. The only real hit is a
  security.txt on the Intercom-hosted help center (help.balloon.app), which is
  Intercom's own vendor security.txt (Canonical: app.intercom.com) and is NOT
  Balloon's own vulnerability-disclosure policy — it is therefore recorded here
  but not wired as a Balloon SecurityTxt/Security pointer.
